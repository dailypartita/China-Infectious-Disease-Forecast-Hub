name: Sync target data from cn_cdc_dashboard

on:
  # cn_cdc_dashboard writes this file with a deploy key as soon as its data
  # commit lands. The file contains the upstream commit SHA. The Friday and
  # Sunday crons are only a backup for a missed request.
  push:
    branches: [main]
    paths:
      - .github/cncdc-sync-request
  schedule:
    - cron: "0 8 * * 5"
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      cncdc_ref:
        description: "cn_cdc_dashboard git ref to read (commit SHA or main)"
        required: false
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: sync-target-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve cn_cdc_dashboard ref
        id: cncdc
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: "${{ github.event.inputs.cncdc_ref }}"
        run: |
          set -euo pipefail
          ref="main"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_REF" ]]; then
            ref="$INPUT_REF"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            ref="$(tr -d '[:space:]' < .github/cncdc-sync-request)"
          fi
          if [[ ! "$ref" =~ ^[A-Za-z0-9._/-]{1,80}$ || "$ref" == *..* ]]; then
            echo "invalid cn_cdc_dashboard ref" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using cn_cdc_dashboard ref $ref"

      - name: Update target data from cn_cdc_dashboard
        env:
          CNCDC_REF: "${{ steps.cncdc.outputs.ref }}"
        run: |
          set -euo pipefail
          # The upstream commit can take a few seconds to show up on raw.githubusercontent.com.
          for attempt in 1 2 3 4 5; do
            if python3 target-data/update_from_cncdc.py --from-github --cncdc-ref "$CNCDC_REF"; then
              exit 0
            fi
            echo "upstream fetch failed (attempt ${attempt}); retrying"
            sleep 15
          done
          exit 1

      # Structural gate before committing straight to main: this push bypasses
      # the PR-based validate-target-data workflow, so refuse to commit files
      # that no longer match the hubverse v6 target data standard (e.g. after
      # an upstream format change in cn_cdc_dashboard).
      - name: Validate regenerated files
        run: |
          pip install --quiet jsonschema
          python3 - <<'EOF'
          import csv, json, sys, urllib.request
          from datetime import date

          import jsonschema

          schema_url = ("https://raw.githubusercontent.com/hubverse-org/"
                        "schemas/main/v6.0.0/tasks-schema.json")
          with urllib.request.urlopen(schema_url, timeout=60) as r:
              schema = json.load(r)
          tasks = json.load(open("hub-config/tasks.json", encoding="utf-8"))
          errors = list(jsonschema.Draft202012Validator(schema).iter_errors(tasks))
          for e in errors[:5]:
              print(f"tasks.json schema error at {e.json_path}: {e.message}")
          if errors:
              sys.exit("tasks.json does not validate against hubverse v6 schema")

          def is_date(s):
              try:
                  date.fromisoformat(s)
                  return True
              except ValueError:
                  return False

          with open("target-data/time-series.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.reader(f))
          header, ts_data = rows[0], rows[1:]
          assert header == ["target_end_date", "target", "location", "observation"], \
              f"time-series.csv header changed: {header}"
          assert ts_data, "time-series.csv has no data rows"
          targets = set()
          for row in ts_data:
              assert len(row) == 4, f"bad time-series row: {row}"
              assert is_date(row[0]), f"bad date in time-series: {row}"
              float(row[3])
              targets.add(row[1])
          assert targets == {"wk inc covid prop ili", "wk inc flu prop ili",
                             "mo inc dengue cases"}, f"unexpected targets: {targets}"

          with open("target-data/oracle-output.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.reader(f))
          header, oracle_data = rows[0], rows[1:]
          assert header == ["reference_date", "target", "horizon", "target_end_date",
                            "location", "output_type", "output_type_id", "oracle_value"], \
              f"oracle-output.csv header changed: {header}"
          assert oracle_data, "oracle-output.csv has no data rows"
          for row in oracle_data:
              assert len(row) == 8, f"bad oracle row: {row}"
              assert is_date(row[0]) and is_date(row[3]), f"bad date in oracle: {row}"
              int(row[2])
              float(row[7])

          print(f"OK: time-series.csv ({len(ts_data)} rows), "
                f"oracle-output.csv ({len(oracle_data)} rows), "
                f"tasks.json valid against hubverse v6 schema")
          EOF

      # Commit the three generated files together. A multiline pathspec
      # passed to git commit recorded only time-series.csv and left the new
      # oracle rows uncommitted.
      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git add -- \
            target-data/time-series.csv \
            target-data/oracle-output.csv \
            hub-config/tasks.json
          if git diff --cached --quiet; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(target-data): sync from cn_cdc_dashboard"
          git push origin HEAD:main
          echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          echo "commit_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Dashboard does not watch this repository. A deploy-key push of
      # .github/rebuild-data-request starts Rebuild Data, which reads the
      # target-data commit just pushed above.
      - name: Ask the dashboard to rebuild forecast data
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
          TARGET_REPO: dailypartita/China-Infectious-Disease-Forecast-Dashboard
          TARGET_FILE: .github/rebuild-data-request
          REF: "${{ steps.commit.outputs.commit_hash }}"
          COMMIT_MESSAGE: "ci: rebuild forecast data from hub target-data"
        run: bash .github/scripts/request-downstream.sh
